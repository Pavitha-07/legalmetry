services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: legalmetry
      POSTGRES_USER: legalmetry
      POSTGRES_PASSWORD: legalmetry
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U legalmetry -d legalmetry"]
      interval: 5s
      timeout: 5s
      retries: 15

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 15

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 15

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: backend/.env
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    # concurrency=1: each PaddleOCR pipeline (detection + recognition +
    # doc-orientation + unwarping + textline-orientation models) is memory-
    # heavy on its own. Running several in parallel forks previously OOM-
    # killed a worker process mid-job under this machine's shared ~5.8GB
    # Docker VM budget, leaving its job stuck at RUNNING forever. Processing
    # panels one at a time is slower wall-clock but reliable.
    command: celery -A app.worker.celery_app worker --loglevel=INFO --concurrency=1
    env_file: backend/.env
    volumes:
      # PaddleOCR downloads its models (now five model groups: detection,
      # recognition, doc-orientation, doc-unwarping, textline-orientation)
      # to this cache directory on first use. Without a volume, every
      # container recreate re-downloads all of them from Hugging Face.
      - paddle_models:/home/appuser/.paddlex
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy

  beat:
    build:
      context: .
      dockerfile: backend/Dockerfile
    # Its own service, not folded into worker's command: worker is
    # deliberately memory-constrained for PaddleOCR (see its concurrency=1
    # note above) and beat has nothing to do with OCR — no reason to share
    # that risk. Doesn't need the paddle_models volume for the same reason.
    command: celery -A app.worker.celery_app beat --loglevel=INFO
    env_file: backend/.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  paddle_models:
  minio_data:
